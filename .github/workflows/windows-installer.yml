name: publish-windows-update

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: publish-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test -p sanctum-core -- --test-threads=1
      - run: cargo test -p sanctum-desktop --lib
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Sanctum v__VERSION__
          releaseBody: |
            SanctumのWindows版。既存のVaultはそのまま引き継がれる。

            v0.3.0以降はSanctumのホーム画面から次の更新を確認・適用できる。
            v0.5.0では個人用ChatGPT/Codexプラグイン、localhost限定MCP接続、競合安全な編集と添付追加を実装する。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
