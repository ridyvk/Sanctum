[package]
name = "sanctum-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "sanctum_desktop_lib"
# Phase 1 ships as a Windows desktop application. Building all three Tauri
# library formats at once can trigger a rustc archive bug during GNU
# cross-compilation; the desktop binary only consumes the Rust rlib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The Tauri CLI enables this feature for production builds. Without this
# bridge, Tauri marks even a release binary as `cfg(dev)` and tries to open the
# Vite development server at localhost instead of the bundled frontend.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
base64 = "0.22"
sanctum-core = { path = "../crates/sanctum-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
