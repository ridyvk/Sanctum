[workspace]
members = ["crates/sanctum-core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.4.1"

[workspace.dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["backup", "bundled", "chrono", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zeroize = "1"
zstd = "0.13"

# A single codegen unit avoids zero-length COFF members observed when rustc
# cross-compiles the release graph for Windows GNU on Linux. It also makes the
# shipped binary's optimization deterministic at the cost of a slower build.
[profile.release]
codegen-units = 1

[profile.release.build-override]
codegen-units = 1
