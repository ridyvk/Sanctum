name: Android preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Configure Android NDK
        shell: bash
        run: |
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - run: npm run tauri android init -- --ci
      - name: Apply Sanctum icon to the generated Android project
        shell: bash
        run: |
          # android init starts with Tauri's default launcher icon. Keep the
          # checked-in Windows icon and Android artwork as the source of truth.
          npm run tauri icon -- src-tauri/icons/icon.png
          icon_res=src-tauri/gen/android/app/src/main/res
          for source in src-tauri/icons/android/mipmap-*/* src-tauri/icons/android/values/*; do
            relative=${source#src-tauri/icons/android/}
            install -Dm644 "$source" "$icon_res/$relative"
          done
          cmp src-tauri/icons/android/mipmap-xxxhdpi/ic_launcher_foreground.png \
            "$icon_res/mipmap-xxxhdpi/ic_launcher_foreground.png"
      - name: Build smaller Android preview APK
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_DEV_STRIP: debuginfo
        run: npm run tauri android build -- --apk --debug --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: sanctum-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  windows-desktop-check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: cargo test -p sanctum-core -- --test-threads=1
      - run: cargo clippy -p sanctum-core --all-targets -- -D warnings
      - run: cargo test -p sanctum-desktop --lib
      - run: cargo clippy -p sanctum-desktop --lib -- -D warnings
      - run: npm run tauri build -- --no-bundle --ci
